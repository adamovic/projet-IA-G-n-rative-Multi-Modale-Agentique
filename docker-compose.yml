services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: maintdoc_pgvector
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintdoc_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintdoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
    driver: local
